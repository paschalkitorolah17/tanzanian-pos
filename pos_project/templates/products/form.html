{% extends "layouts/app.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="mb-4">
    <h4 class="mb-0 fw-bold">{{ title }}</h4>
</div>

{% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<div class="card" style="max-width: 720px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Product Name *</label>
                    <input type="text" name="name" class="form-control" required
                           value="{{ product.name|default:'' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">SKU *</label>
                    <input type="text" name="sku" class="form-control" required
                           value="{{ product.sku|default:'' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Barcode</label>
                    <input type="text" name="barcode" class="form-control"
                           value="{{ product.barcode|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select">
                        <option value="">— None —</option>
                        {% for c in categories %}
                        <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>
                            {{ c.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Unit</label>
                    <input type="text" name="unit" class="form-control" value="{{ product.unit|default:'pcs' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cost Price (TZS)</label>
                    <input type="number" name="cost_price" class="form-control" step="100" min="0"
                           value="{{ product.cost_price|default:'0' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Selling Price (TZS) *</label>
                    <input type="number" name="selling_price" class="form-control" step="100" min="1" required
                           value="{{ product.selling_price|default:'' }}">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Tax Status</label>
                    <select name="tax_status" class="form-select">
                        <option value="taxable" {% if product.tax_status == 'taxable' %}selected{% endif %}>Taxable</option>
                        <option value="zero_rated" {% if product.tax_status == 'zero_rated' %}selected{% endif %}>Zero Rated</option>
                        <option value="exempt" {% if product.tax_status == 'exempt' %}selected{% endif %}>Exempt</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Tax Rate (%)</label>
                    <input type="number" name="tax_rate" class="form-control" step="0.01"
                           value="{{ product.tax_rate|default:'18' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Reorder Level</label>
                    <input type="number" name="reorder_level" class="form-control" step="1" min="0"
                           value="{{ product.reorder_level|default:'0' }}">
                </div>

                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="2">{{ product.description|default:'' }}</textarea>
                </div>

                {% if product %}
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="is_active" class="form-check-input" id="is_active"
                               {% if product.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Active</label>
                    </div>
                </div>
                {% endif %}
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-neon">Save Product</button>
                <a href="{% url 'product-list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
