{% extends "layouts/app.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="mb-4">
    <h4 class="mb-0 fw-bold">{{ title }}</h4>
</div>

{% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
{% endif %}

<div class="card" style="max-width: 520px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Category Name *</label>
                <input type="text" name="name" class="form-control" required
                       value="{{ category.name|default:'' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="2">{{ category.description|default:'' }}</textarea>
            </div>

            {% if category %}
            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" name="is_active" class="form-check-input" id="is_active"
                           {% if category.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
            </div>
            {% endif %}

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-neon">Save Category</button>
                <a href="{% url 'category-list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
