<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Labels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 10px; }

        .label-sheet {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .label {
            width: 50mm;
            height: 30mm;
            border: 1px dashed #ccc;
            padding: 4px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            page-break-inside: avoid;
            overflow: hidden;
        }

        .label .name {
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .label .price {
            font-size: 11px;
            font-weight: bold;
            margin-top: 2px;
        }

        .label img {
            max-width: 44mm;
            height: 12mm;
            object-fit: contain;
        }

        .label .code {
            font-size: 8px;
            color: #333;
        }

        .no-print {
            text-align: center;
            margin-bottom: 15px;
        }

        .btn {
            padding: 8px 16px;
            background: #00E676;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        @media print {
            .no-print { display: none !important; }
            body { padding: 0; }
            .label { border: none; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button class="btn" onclick="window.print()">🖨️ Print Labels</button>
    <p style="margin-top:8px; font-size:13px; color:#666;">
        {{ labels|length }} label(s) ready · Adjust printer to label size if needed
    </p>
</div>

<div class="label-sheet">
    {% for product in labels %}
    <div class="label">
        <div class="name">{{ product.name|truncatechars:28 }}</div>
        <img src="{% url 'barcode-image' product.id %}" alt="barcode">
        <div class="code">{{ product.barcode|default:product.sku }}</div>
        <div class="price">TZS {{ product.selling_price|floatformat:0 }}</div>
    </div>
    {% endfor %}
</div>

<script>
    // Optional: auto-open print dialog
    // window.onload = () => setTimeout(() => window.print(), 500);
</script>
</body>
</html>
